<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学中文！ - Community Chinese Learning</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Times New Roman", "Noto Serif JP", YuMincho, "Hiragino Mincho ProN", serif;
    }
    .hover-lift {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .hover-lift:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
    }
  </style>
</head>
<body class="bg-neutral-50 text-neutral-900 antialiased min-h-screen flex flex-col">

  <!-- Header & Navigation -->
  <header class="bg-neutral-950 text-white border-b border-neutral-800 sticky top-0 z-50 shadow-md">
    <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center space-x-3">
        <span class="bg-rose-600 text-white font-bold text-lg px-2.5 py-0.5 rounded shadow-sm">学</span>
        <div>
          <h1 class="font-bold text-lg leading-none tracking-wide">学中文！ Chinese Hub</h1>
          <p class="text-xs text-neutral-400 mt-1">Community-driven Language Lab</p>
        </div>
      </div>
      
      <!-- Day Switcher Buttons -->
      <div class="flex items-center space-x-2 bg-neutral-900 p-1 rounded-xl border border-neutral-800" id="day-buttons">
        <button onclick="switchDay(1)" id="btn-day1" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer bg-rose-600 text-white">Day 01</button>
        <button onclick="switchDay(2)" id="btn-day2" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer text-neutral-400 hover:text-white">Day 02</button>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="bg-neutral-950 text-white py-10 px-4 border-b border-neutral-800 relative overflow-hidden">
    <div class="absolute -top-24 -right-24 w-96 h-96 bg-rose-950/30 rounded-full blur-3xl pointer-events-none"></div>
    <div class="max-w-4xl mx-auto relative z-10">
      <div class="inline-flex items-center space-x-2 text-rose-400 text-xs font-semibold tracking-wider uppercase mb-3 bg-rose-950/50 px-3 py-1 rounded-full border border-rose-900/50">
        <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
        <span id="hero-tag">Day Focus</span>
      </div>
      <h2 id="hero-title" class="text-3xl sm:text-4xl font-bold tracking-tight mb-4 text-neutral-100">読み込み中...</h2>
      <div class="bg-neutral-900/90 border border-neutral-800 rounded-xl p-4 flex items-start space-x-3 text-xs text-neutral-300 backdrop-blur-sm">
        <i data-lucide="globe" class="w-4 h-4 text-rose-400 shrink-0 mt-0.5"></i>
        <div>
          <strong class="text-rose-300 font-semibold">For English Speakers:</strong>
          <span id="hero-english" class="ml-1 text-neutral-300">...</span>
        </div>
      </div>
    </div>
  </section>

  <!-- Main Dynamic Area -->
  <main class="max-w-4xl mx-auto px-4 py-10 flex-1 w-full space-y-12" id="main-content">
    <!-- 各Dayのコンテンツがここに自動注入されます -->
  </main>

  <!-- Footer -->
  <footer class="bg-neutral-950 text-neutral-400 py-8 text-center text-xs border-t border-neutral-800">
    <p>© kodyyork 2026 • Community Chinese Learning Hub</p>
  </footer>

  <!-- データファイルの読み込み -->
  <script src="./data/lessons/day01.js"></script>
  <script src="./data/lessons/day02.js"></script>

  <!-- ロジック制御JS -->
  <script>
    let currentDay = 1;
    let currentSpeed = 0.75;

    function setSpeed(speed) {
      currentSpeed = speed;
      document.getElementById('speed-075').className = speed === 0.75
        ? "px-3.5 py-1.5 text-xs rounded-lg border border-neutral-900 bg-neutral-900 text-white font-medium transition cursor-pointer"
        : "px-3.5 py-1.5 text-xs rounded-lg border border-neutral-200 bg-neutral-50 text-neutral-700 hover:border-neutral-900 font-medium transition cursor-pointer";
      document.getElementById('speed-100').className = speed === 1.0
        ? "px-3.5 py-1.5 text-xs rounded-lg border border-neutral-900 bg-neutral-900 text-white font-medium transition cursor-pointer"
        : "px-3.5 py-1.5 text-xs rounded-lg border border-neutral-200 bg-neutral-50 text-neutral-700 hover:border-neutral-900 font-medium transition cursor-pointer";
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        utterance.rate = currentSpeed;
        window.speechSynthesis.speak(utterance);
      }
    }

    function switchDay(dayNum) {
      currentDay = dayNum;
      
      // ボタンの見た目更新
      document.getElementById('btn-day1').className = dayNum === 1 
        ? "px-3.5 py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer bg-rose-600 text-white" 
        : "px-3.5 py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer text-neutral-400 hover:text-white";
      document.getElementById('btn-day2').className = dayNum === 2 
        ? "px-3.5 py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer bg-rose-600 text-white" 
        : "px-3.5 py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer text-neutral-400 hover:text-white";

      // データ切り替え
      const data = dayNum === 1 ? day01Data : day02Data;
      
      document.getElementById('hero-tag').innerText = data.tag;
      document.getElementById('hero-title').innerText = data.title;
      document.getElementById('hero-english').innerText = data.englishNote;
      document.getElementById('main-content').innerHTML = data.htmlContent;

      lucide.createIcons();
    }

    window.addEventListener('DOMContentLoaded', () => {
      switchDay(1);
    });
  </script>
</body>
</html>
