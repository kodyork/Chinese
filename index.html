<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学中文！ - Community Chinese Learning</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="bg-rose-500 text-white font-bold text-xl px-2.5 py-1 rounded-lg">学</span>
        <div>
          <h1 class="font-bold text-lg leading-none">学中文！ Chinese Hub</h1>
          <p class="text-xs text-slate-400 mt-0.5">Community-driven Language Lab</p>
        </div>
      </div>
      <div class="flex items-center space-x-3 text-sm">
        <span id="lesson-day" class="hidden sm:inline-block px-2.5 py-1 bg-slate-800 text-rose-400 rounded-full text-xs font-semibold border border-slate-700">Day 01</span>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="bg-gradient-to-b from-slate-900 to-slate-800 text-white py-10 px-4 border-b border-slate-800">
    <div class="max-w-4xl mx-auto">
      <h2 id="lesson-title" class="text-3xl sm:text-4xl font-extrabold tracking-tight mb-3">
        読み込み中...
      </h2>
      <div class="mt-4 bg-slate-800/80 border border-slate-700/80 rounded-xl p-3.5 flex items-start space-x-3 text-xs text-slate-300">
        <i data-lucide="globe" class="w-4 h-4 text-sky-400 shrink-0 mt-0.5"></i>
        <div>
          <strong class="text-sky-300 font-semibold">For English Speakers (C1 Level):</strong>
          <span id="english-note">Loading...</span>
        </div>
      </div>
    </div>
  </section>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full space-y-12">

    <!-- Speed Controller -->
    <div class="bg-rose-50 border border-rose-200 rounded-xl p-4 flex flex-col sm:flex-row items-center justify-between gap-3 text-rose-900">
      <div class="flex items-center space-x-2">
        <i data-lucide="volume-2" class="w-5 h-5 text-rose-600 shrink-0"></i>
        <span class="text-sm font-medium">発音スピード調整（Audio Speed Controller）:</span>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="setSpeed(0.75)" id="speed-075" class="px-3 py-1 text-xs rounded-lg bg-rose-600 text-white font-medium transition">0.75x (Slow)</button>
        <button onclick="setSpeed(1.0)" id="speed-100" class="px-3 py-1 text-xs rounded-lg bg-rose-100 text-rose-700 hover:bg-rose-200 font-medium transition">1.0x (Normal)</button>
      </div>
    </div>

    <!-- Section 1: Phonetics -->
    <section class="space-y-4">
      <div class="flex items-center space-x-2 border-b border-slate-200 pb-2">
        <i data-lucide="mic" class="w-5 h-5 text-rose-500"></i>
        <h3 class="text-xl font-bold text-slate-900">1. 今日の発音ポイント：声調（Tones）</h3>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2" id="phonetics-container"></div>
    </section>

    <!-- Section 2: Dialogues -->
    <section class="space-y-4">
      <div class="flex items-center space-x-2 border-b border-slate-200 pb-2">
        <i data-lucide="message-square" class="w-5 h-5 text-rose-500"></i>
        <h3 class="text-xl font-bold text-slate-900">2. 実践会話：カフェで自己紹介</h3>
      </div>
      <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm" id="dialogues-container"></div>
    </section>

    <!-- Section 3: Quizzes -->
    <section class="space-y-6">
      <div class="flex items-center space-x-2 border-b border-slate-200 pb-2">
        <i data-lucide="check-square" class="w-5 h-5 text-rose-500"></i>
        <h3 class="text-xl font-bold text-slate-900">3. インタラクティブ穴埋め・選択問題</h3>
      </div>
      <div class="space-y-6" id="quizzes-container"></div>
    </section>

  </main>

  <footer class="bg-slate-900 border-t border-slate-800 text-slate-400 py-6 text-center text-xs">
    <p>© Community Chinese Learning Hub</p>
  </footer>

  <script src="./js/app.js"></script>
</body>
</html>
